- aid: ledgerx:market-data
  name: MIAXdx Market Data and Account API
  description: 'Public and authenticated REST API on api.ledgerx.com covering exchange contracts,
    traded contracts, contract tickers, positions, trades (own and global), upcoming exchange
    holidays and account balances. Responses are paginated with offset/limit and a meta navigation
    object, and endpoints are individually rate limited by IP.'
