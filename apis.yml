- aid: ledgerx:trading
  name: MIAXdx Trading API
  description: 'Authenticated order-entry REST API on trade.ledgerx.com for listing resting limit
    orders, placing orders, cancelling a single order or all orders for an MPID, atomically
    cancel-replacing an order, and retrieving the current book state for a contract. Orders are
    tracked by the message id (mid) returned on submission and followed over the WebSocket feed.'
  humanURL: https://docs.miaxdx.com/reference/open-orders
