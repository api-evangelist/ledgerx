aid: ledgerx
name: LedgerX (MIAX Derivatives Exchange)
description: 'LedgerX LLC, doing business as MIAX Derivatives Exchange (MIAXdx), is a CFTC-regulated
  derivatives venue registered as a Designated Contract Market (DCM), Swap Execution Facility (SEF)
  and Derivatives Clearing Organization (DCO). Founded in 2014 under Ledger Holdings Inc. and backed
  by GV and Lightspeed Venture Partners, it pioneered physically settled, federally regulated Bitcoin
  options and swaps for institutional and retail traders. Ledger Holdings was acquired by West Realm
  Shires (FTX.US) in 2021; after the FTX bankruptcy, Miami International Holdings acquired MIAXdx in
  May 2023, and in November 2025 MIAX agreed to sell 90% of the exchange to Robinhood Markets in
  partnership with Susquehanna International Group. The exchange published a public REST API for
  contracts, positions, trades, balances and order entry, plus a WebSocket market data feed carrying
  action reports, top-of-book updates and exchange heartbeats, authenticated with JWT API keys. Its
  physically settled DCM/SEF products were delisted in July 2024 and the public developer surface
  (docs, api and trade hosts, status page) is currently unreachable or inactive.'
