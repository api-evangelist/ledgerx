summary: >-
  The MIAXdx (LedgerX) public API surface is effectively dormant. The documentation host, the REST
  API host and the order-entry host are all unreachable to external clients as of this probe, and
  the exchange's status page has been marked inactive by Statuspage. The exchange delisted its
  physically settled DCM and SEF products in July 2024, and in November 2025 Miami International
  Holdings agreed to sell 90% of MIAXdx to Robinhood Markets in partnership with Susquehanna
  International Group.
